<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>我不是机器人｜监狱测试互动演示</title>
  <style>
    :root{--bg:#070d13;--panel:#0a1721;--line:#2b6878;--cyan:#79e5f1;--soft:#9bb5bd;--text:#eef9f9;--warn:#e79a66}
    *{box-sizing:border-box} html,body{min-height:100%;margin:0}
    body{background:radial-gradient(circle at 50% -20%,#12303b 0%,var(--bg) 60%);color:var(--text);font-family:Arial,"PingFang SC","Hiragino Sans GB",sans-serif;line-height:1.55}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background:repeating-linear-gradient(to bottom,transparent 0 3px,#91b9bf 4px,transparent 5px)}
    .wrap{width:min(960px,calc(100% - 32px));margin:38px auto 34px;position:relative}
    .top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:26px}
    .brand{font-size:12px;letter-spacing:.24em;color:var(--cyan);font-weight:700}.meta{font-size:12px;color:var(--soft);text-align:right}
    .frame{border:1px solid #427a86;box-shadow:0 0 0 9px #07131b,0 0 0 10px #1b4651,0 22px 80px #0009,inset 0 0 42px #146a7322;background:linear-gradient(145deg,#0b1a23,#071019);min-height:620px;position:relative;overflow:hidden}
    .frame:before,.frame:after{content:"";position:absolute;width:38px;height:38px;border-color:var(--cyan);opacity:.65;pointer-events:none}.frame:before{left:13px;top:13px;border-left:2px solid;border-top:2px solid}.frame:after{right:13px;bottom:13px;border-right:2px solid;border-bottom:2px solid}
    .syshead{border-bottom:1px solid #27545f;padding:23px 34px 18px;display:flex;justify-content:space-between;gap:12px;color:var(--cyan);font-size:11px;letter-spacing:.18em;font-family:Menlo,Consolas,monospace}
    .progress{height:3px;background:#152a33}.bar{height:100%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);transition:width .35s}
    main{padding:48px clamp(24px,7vw,76px) 44px;max-width:820px;margin:auto;min-height:470px}
    .eyebrow{font-size:11px;letter-spacing:.22em;color:var(--cyan);font-weight:700;margin:0 0 17px}.title{font-size:clamp(29px,5vw,48px);line-height:1.18;letter-spacing:.02em;margin:0 0 17px;font-weight:680}.copy{font-size:16px;color:#c7dadd;max-width:650px;margin:0 0 22px}.muted{font-size:13px;color:var(--soft)}
    .question{font-size:clamp(25px,4vw,38px);line-height:1.3;margin:7px 0 26px;font-weight:610}.choices{display:grid;gap:12px;margin-top:26px}.choice{width:100%;text-align:left;color:var(--text);background:#0d222c;border:1px solid #2c6070;padding:15px 18px;font:inherit;font-size:16px;cursor:pointer;transition:.2s}.choice:hover,.choice:focus-visible{border-color:var(--cyan);background:#143541;box-shadow:0 0 18px #68e4e92c;outline:none;transform:translateY(-1px)}.choice small{display:block;font-size:12px;color:var(--soft);margin-top:3px}
    .label{font-family:Menlo,Consolas,monospace;color:var(--cyan);padding-right:13px}.feedback{border-left:2px solid var(--warn);background:#3f291f66;padding:16px 19px;color:#f7d9c7;margin:21px 0 24px}.result{font-size:clamp(70px,14vw,126px);line-height:1;font-weight:720;letter-spacing:-.07em;color:var(--cyan);text-shadow:0 0 24px #6fe3ed80;margin:18px 0 13px}.result span{font-size:.48em;letter-spacing:0}.systemline{font-family:Menlo,Consolas,monospace;color:#bdeef1;font-size:14px}
    .footer{border-top:1px solid #27545f;display:flex;justify-content:space-between;gap:12px;padding:14px 32px;font:11px Menlo,Consolas,monospace;color:#7fb1bd;letter-spacing:.07em}
    .below{display:flex;justify-content:space-between;gap:22px;margin-top:27px;align-items:flex-start}.note{color:#a9bdc4;font-size:13px;max-width:660px}.outline{border:1px solid #336877;background:transparent;color:var(--cyan);padding:9px 15px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}.outline:hover{background:#143541}
    .history{font-size:13px;color:#9dbac1;margin:20px 0 0;border-top:1px solid #224552;padding-top:13px}.history strong{color:var(--cyan);font-weight:600}
    .barcode{font-size:19px;letter-spacing:-.24em;line-height:.7;color:#567b83;display:inline-block;margin-right:11px;transition:color .5s,text-shadow .5s}.barcode.active{color:var(--cyan);text-shadow:0 0 11px var(--cyan)}
    .compare{border:1px solid #285361;padding:12px 15px;margin:17px 0;color:#a9c3c9;font-size:13px}.compare b{color:var(--cyan)}
    @media(max-width:620px){.wrap{margin:22px auto}.frame{min-height:610px}.syshead{padding:19px 22px 15px}.footer{padding:14px 22px}.below{display:block}.outline{margin-top:10px}.meta{max-width:120px}.copy{font-size:15px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top"><div class="brand">我不是机器人 / I AM NOT A ROBOT</div><div class="meta">互动改编演示 · 监狱测试片段<br>陈佳琪 / 2026</div></header>
    <div class="frame">
      <div class="syshead"><span>PWCST.00-14269</span><span id="status">SYSTEM / WAITING</span></div>
      <div class="progress" aria-hidden="true"><div class="bar" id="bar" style="width:0%"></div></div>
      <main id="screen" aria-live="polite"></main>
      <div class="footer"><span>MODE 08 · POLT.7</span><span><span id="barcode" class="barcode" aria-label="条形码伏笔">▌▍▌▍▍▌▌▍▌▍▌</span>SYS. GTE. 3210</span></div>
    </div>
    <div class="below"><div class="note">本页改编自短片《我不是机器人》中的监狱测试画面。原片出现的题目、事故追问和“85%”结果作为基础；不同回答后的反馈是为互动演示新增的虚构内容。页面采用预设分支，不含真实身份识别或 AI Agent。</div><button class="outline" id="restart" type="button">重新开始 ↺</button></div>
  </div>
  <script>
    const screen=document.getElementById('screen');
    const status=document.getElementById('status');
    const bar=document.getElementById('bar');
    const barcode=document.getElementById('barcode');
    const state={path:[],fragment:'',previous:[]};
    // 叙事内容与界面函数分开：所有新增线索都集中在这里，便于按原片设定修改。
    const fragments={
      car:['档案里有车祸记录；你却发现，记录上的日期早于你记忆中最后一次见到他们。','日期矛盾：记忆与档案至少有一处不可靠。'],
      fire:['系统调出一段火灾影像。画面中你听见自己的声音，却看不到父母。','影像矛盾：你记得火灾，却记不清自己为什么在场。'],
      plane:['航班名单缓慢滚动。你反复查找，始终找不到他们的名字。','名单缺口：你记得空难，名单却无法证明他们在飞机上。'],
      check:['档案显示死亡证明，但“亲属关系”一栏被遮蔽。你无法确认这份记录指向的是谁。','身份缺口：档案给出死亡信息，却遮住了关键关系。'],
      trust:['你念出他们的名字。名字听起来熟悉，可你想不起他们是怎样叫你的。','称呼缺口：熟悉的名字没有带回对应的相处记忆。'],
      hold:['计时结束。系统把沉默记为有效数据；你仍不知道它据此推断了什么。','规则缺口：拒答也被统计，但评估依据没有公开。']
    };
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function frame(stage,content,percent){status.textContent=stage;bar.style.width=percent+'%';screen.innerHTML=content;screen.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',()=>next(b.dataset.next)));screen.querySelector('button')?.focus({preventScroll:true});}
    function choices(items){return '<div class="choices">'+items.map(([key,title,sub,code])=>'<button class="choice" type="button" data-next="'+key+'"><span class="label">'+code+'</span>'+title+(sub?'<small>'+sub+'</small>':'')+'</button>').join('')+'</div>';}
    function history(){return state.path.length?'<p class="history"><strong>已记录选择：</strong>'+state.path.map(esc).join(' / ')+'</p>':'';}
    function intro(){frame('SYSTEM / STANDBY','<p class="eyebrow">交互式叙事实验 · 约 2 分钟</p><h1 class="title">你能证明<br>自己是人类吗？</h1><p class="copy">顶楼对峙的瞬间，一段监狱里的测试记忆重新浮现。现在，由你代入主角回答。系统会记录每一次选择。</p><p class="muted">此处仅演示原片中测试片段的互动改编；不改变短片成片。</p>'+choices([['question','进入测试','从一段不完整的记忆开始','→']]),0);}
    function question(){frame('QUESTION 04 / IDENTITY TEST','<p class="eyebrow">监狱记录 / 问题 04</p><h2 class="question">你年幼时，父母去世了吗？</h2><p class="copy">你想不起他们的脸，却似乎记得某一天，有人告诉过你答案。</p>'+choices([['yes','是','继续追问这段记忆','A'],['no','没有','坚持你记得的事实','B'],['skip','不想回答','暂时拒绝交出这段记忆','C']])+history(),31);}
    function accident(){frame('FOLLOW-UP / MEMORY DETAIL','<p class="eyebrow">追问 / 仅在选择“是”后出现</p><h2 class="question">他们死于一场离奇事故吗？</h2><p class="copy">你能抓住一个画面，却无法确定它属于谁。</p>'+choices([['car','车祸','路面与灯光','A'],['fire','火灾','火光与烟雾','B'],['plane','空难','失联与广播','C']])+history(),62);}
    function noFollowup(){frame('FOLLOW-UP / RECORD CONFLICT','<p class="eyebrow">追问 / 互动版新增</p><h2 class="question">系统显示：你的回答与档案不一致。</h2><p class="copy">屏幕上的记录写着“已故”。你记忆里却始终有人在等你回家。你要怎么回应？</p>'+choices([['check','查看档案','尝试寻找可核对的细节','A'],['trust','相信记忆','拒绝让一份记录替你定义过去','B']])+history(),62);}
    function skipFollowup(){frame('FOLLOW-UP / NO RESPONSE','<p class="eyebrow">追问 / 互动版新增</p><h2 class="question">系统记录：拒绝回答。</h2><p class="copy">计时器没有停止。屏幕又亮起同一行字：“请确认是否继续拒答。”</p>'+choices([['hold','继续拒答','让空白成为你的回答','A'],['return','改为回答','回到上一题','B']])+history(),62);}
    function response(text,fragment){state.fragment=fragment;frame('MEMORY / FRAGMENT','<p class="eyebrow">记忆反馈 / 互动版新增</p><h2 class="question">记录中出现了一道裂缝。</h2><div class="feedback">'+esc(text)+'</div><p class="copy">你无法判断：是自己的记忆出了错，还是系统掌握着另一套叙述。</p>'+choices([['result','查看测试结果','系统正在生成结论','→']])+history(),77);}
    function result(){barcode.classList.add('active');let comparison=state.previous.length?'<div class="compare"><b>上一轮留下的疑点：</b>'+esc(state.previous[state.previous.length-1])+'<br><b>这一轮留下的疑点：</b>'+esc(state.fragment)+'</div>':'';frame('ASSESSMENT / COMPLETE','<p class="eyebrow">身份评估 / 原片中的固定结果</p><div class="result">85<span>%</span></div><p class="systemline">THERE IS AN 85% PROBABILITY THAT YOU ARE A ROBOT.</p><p class="copy" style="margin-top:24px">这个数字不会因你的回答而改变。测试到此结束；它没有告诉你，哪段记忆是真的。</p><div class="feedback">本次路径留下的疑点：'+esc(state.fragment)+'</div>'+comparison+'<p class="muted">顶楼的声音再次传来。短片的故事从这里继续。</p>'+choices([['again','换一种回答再试一次','观察另一条路径会出现什么信息','↺']])+history(),100);}
    function next(id){
      switch(id){
        case 'question':question();break;
        case 'yes':state.path.push('父母去世：是');accident();break;
        case 'no':state.path.push('父母去世：否');noFollowup();break;
        case 'skip':state.path.push('父母去世：拒答');skipFollowup();break;
        case 'car':case 'fire':case 'plane':case 'check':case 'trust':case 'hold':{
          const labels={car:'事故：车祸',fire:'事故：火灾',plane:'事故：空难',check:'查看档案',trust:'相信记忆',hold:'继续拒答'};
          state.path.push(labels[id]);response(...fragments[id]);break;
        }
        case 'return':state.path.push('重新作答');question();break;
        case 'result':result();break;
        case 'again':state.previous.push(state.fragment);reset(true);break;
      }
    }
    function reset(keepPrevious=false){state.path=[];state.fragment='';if(!keepPrevious)state.previous=[];barcode.classList.remove('active');intro();}
    document.getElementById('restart').addEventListener('click',()=>reset(false));
    reset(false);
  </script>
</body>
</html>
